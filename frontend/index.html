<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Illuminated board game app</title>
    <link rel="manifest" href="/app.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <style>
      body {
        background-color: #242424;
        margin: 0;
        color: #E3E3E3;
      }
      @font-face {
        font-family: 'Amarante';
        src: url('./src/assets/Amarante-Regular.ttf') format('truetype');
        font-display: swap;
      }
    </style>
    <link rel="preload" href="/src/assets/Amarante-Regular.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <div id="root" style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100dvh;
        width: 100vw;
    ">
      <img src="/src/assets/toad.png" 
        width="100" height="100" 
        style="filter: invert(1)" 
        onload="document.getElementById('loading-text').style.visibility = 'visible';"
      />
      <div id="loading-text" style="
        font-family: 'Amarante', serif;
        font-size: clamp(2rem, 0.5rem + 10vw, 3rem);
        visibility: hidden;
      ">
        Loading...
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
